<title>Sunday Edge Picks</title>
<!-- Template for the picks dashboard. picks.py replaces the DATA line with
     this run's bets, fair lines and graded history, so the page needs no
     server or fetch and works from GitHub Pages or as a saved file. -->
<style>
:root{--bg:#0b1120;--panel:#131c31;--panel2:#1a2540;--fg:#e8eef8;--mute:#8b9bb4;
--line:rgba(139,155,180,.18);--acc:#4f9dff;--ok:#2fbf71;--bad:#ef5d5d;--warn:#f0b43c}
@media (prefers-color-scheme: light){:root{--bg:#f3f5f9;--panel:#fff;--panel2:#eef2f8;
--fg:#0f172a;--mute:#5b6b82;--line:rgba(15,23,42,.1);--acc:#1f6fe0;--ok:#16924f;--bad:#cf3a3a;--warn:#b7791f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:18px}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}
h1 span{color:var(--acc)}
.brand{display:flex;align-items:center;gap:10px}
.mascot{width:48px;height:48px;flex:0 0 auto}
.sub{color:var(--mute);font-size:.85rem}
h2{font-size:1.05rem;margin:28px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi small{color:var(--mute);font-size:.78rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;
padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.day{color:var(--mute);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bet{font-size:1.15rem;font-weight:700;line-height:1.25}
.pill{font-size:.72rem;background:var(--panel2);border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--mute)}
.game{color:var(--mute);font-size:.85rem}
.nums{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.nums span{display:flex;flex-direction:column;font-size:.72rem;color:var(--mute)}
.nums b{font-size:1rem;color:var(--fg)}
.meter{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.why{font-size:.88rem;margin:0}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--mute);text-align:center}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
padding:6px 9px;font-size:.78rem;white-space:nowrap;display:none}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.win{color:var(--ok);font-weight:600}.loss{color:var(--bad);font-weight:600}.push,.open{color:var(--mute)}
details{margin-top:28px}summary{cursor:pointer;font-weight:600}
#nav{color:var(--acc);text-decoration:none;margin-left:8px;white-space:nowrap}
footer{color:var(--mute);font-size:.75rem;margin-top:32px}
</style>
</head>

<main>
<header>
  <div class="brand"><svg class="mascot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Big-nose guy getting a haircut"><path d="M26 120 C30 104 40 94 52 91 L84 91 C96 94 104 106 106 120 Z" fill="#f4f6f8" stroke="#c4ccd6" stroke-width="2"/><path d="M48 98 L66 94 M70 96 L86 100" stroke="#d3dae3" stroke-width="2" stroke-linecap="round"/><path d="M56 88 C56 82 82 82 82 88 L82 93 L56 93 Z" fill="#d79e86"/><circle cx="70" cy="56" r="29" fill="#e8b49b" stroke="#a8705c" stroke-width="2"/><ellipse cx="91" cy="62" rx="5" ry="8" fill="#dea48a"/><g fill="#c9c9c9" stroke="#7f7f7f" stroke-width="1.6"><circle cx="93" cy="40" r="6"/><circle cx="98" cy="48" r="6"/><circle cx="96" cy="57" r="6"/><circle cx="88" cy="35" r="5"/><circle cx="99" cy="38" r="4.5"/><circle cx="101" cy="56" r="4"/></g><path d="M48 38 C33 41 18 55 11 74 C6 90 16 103 31 100 C42 98 50 92 56 84 C62 76 64 56 58 42 Z" fill="#e3a68d"/><path d="M48 38 C33 41 18 55 11 74 C6 90 16 103 31 100 C42 98 50 92 56 84" fill="none" stroke="#a8705c" stroke-width="2" stroke-linecap="round"/><path d="M50 42 C56 50 58 60 57 68" fill="none" stroke="#c48a73" stroke-width="1.4" stroke-linecap="round"/><path d="M24 66 C30 62 36 63 40 67 M20 80 C25 77 29 78 32 81" fill="none" stroke="#b77c66" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="36" cy="95" rx="5.5" ry="2.4" fill="#7a4536" transform="rotate(-14 36 95)"/><ellipse cx="64" cy="52" rx="5.5" ry="3.6" fill="#fff"/><circle cx="63" cy="53" r="2.4" fill="#3a3a3a"/><path d="M57 50 C61 46 68 46 71 50" fill="#e3a68d" stroke="#8a5644" stroke-width="2" stroke-linecap="round"/><path d="M58 58 C62 61 67 61 71 58 M60 62 C64 64 68 64 71 62" fill="none" stroke="#b77c66" stroke-width="1.3" stroke-linecap="round"/><path d="M56 36 C64 32 74 32 82 36 M58 30 C65 27 73 27 79 30" fill="none" stroke="#b77c66" stroke-width="1.4" stroke-linecap="round"/><path d="M60 83 C64 85 69 85 72 82" fill="none" stroke="#8a5644" stroke-width="1.8" stroke-linecap="round"/><g transform="translate(104 22) rotate(35)" stroke="#b6ff3b" stroke-width="2.6" fill="none" stroke-linecap="round"><path d="M0 -14 L0 4"/><path d="M-5 -13 L3 4"/><circle cx="-2" cy="9" r="4"/><circle cx="5" cy="9" r="4"/></g></svg>
    <h1 id="title">Sunday <span>Edge</span></h1>
  </div>
  <div class="sub"><span id="updated"></span> <a id="nav" href="https://bviolino93.github.io/NFL-model/">NFL picks →</a></div>
</header>

<section class="kpis" id="slate-kpis"></section>
<div class="bar" id="filters"></div>
<section id="bets"></section>

<h2>Track record</h2>
<section class="kpis" id="record-kpis"></section>
<div class="chart" id="chart"><div class="tip" id="tip"></div></div>
<div class="tablewrap"><table id="history"></table></div>

<section id="paper-wrap">
  <h2>Spread test (no money)</h2>
  <p class="sub" id="paper-sub"></p>
  <section class="kpis" id="paper-kpis"></section>
  <div class="tablewrap"><table id="paper"></table></div>
</section>

<details>
  <summary>Fair lines this run</summary>
  <div class="tablewrap"><table id="fair"></table></div>
</details>

<footer>Stakes are quarter-Kelly on the bankroll shown, capped at 2% per bet and
10% per slate. Win chances are model estimates, not guarantees. 21+ where legal;
1-800-GAMBLER.</footer>
</main>

<script id="data" type="application/json">/*DATA*/</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const money = (x) => (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString(undefined,
    {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const signed = (x) => (x > 0 ? "+" : "") + money(x);
  const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
  const odds = (p) => (p > 0 ? "+" : "") + Math.round(p);
  const ET = {timeZone: "America/New_York"};
  const kick = (s) => new Date(s).toLocaleString("en-US",
    {...ET, weekday: "short", hour: "numeric", minute: "2-digit"}) + " ET";
  const dayOf = (s) => new Date(s).toLocaleDateString("en-US",
    {...ET, weekday: "long", month: "short", day: "numeric"});
  // NFL names shorten to the nickname; college pages pass school names.
  const short = (team) => (D.names && D.names[team]) || team.split(" ").slice(-1)[0];
  const label = (b) => {
    if (b.market === "totals") return `${b.pick} ${b.point}`;
    const pt = b.point > 0 ? "+" + b.point : String(b.point);
    return `${b.pick} ${pt}`;
  };
  const kpi = (box, value, name, cls) => {
    const k = el("div", "kpi");
    const v = el("b", cls || "", value);
    k.append(v, el("small", "", name));
    box.append(k);
  };

  if (D.title) {
    const [a, b] = D.title.split(" ");
    $("title").replaceChildren(document.createTextNode(a + " "), el("span", "", b));
    document.title = D.title + " Picks";
  }
  if (D.nav) { $("nav").href = D.nav.href; $("nav").textContent = D.nav.text; }
  $("updated").textContent = `Updated ${D.updated} · $${D.bankroll.toLocaleString()} bankroll`;

  // ---- this slate
  const picks = D.picks;
  const slate = $("slate-kpis");
  const stake = picks.reduce((s, b) => s + b.stake, 0);
  kpi(slate, String(picks.length), picks.length === 1 ? "bet" : "bets");
  kpi(slate, money(stake), "total stake");
  kpi(slate, picks.length ? pct(picks.reduce((s, b) => s + b.win_chance, 0) / picks.length) : "—",
      "average win chance");
  kpi(slate, picks.length ? signed(picks.reduce((s, b) => s + b.stake * b.ev, 0)) : "—",
      "expected profit");

  const markets = {all: "All", totals: "Totals", spreads: "Spreads"};
  const present = new Set(picks.map((b) => b.market));
  let filter = "all";
  const bar = $("filters");
  Object.entries(markets).forEach(([key, name]) => {
    if (key !== "all" && !present.has(key)) return;
    const c = el("button", "chip", name);
    c.type = "button";
    c.setAttribute("aria-pressed", String(key === filter));
    c.addEventListener("click", () => {
      filter = key;
      bar.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === c)));
      drawBets();
    });
    bar.append(c);
  });
  if (present.size < 2) bar.hidden = true;

  function drawBets() {
    const box = $("bets");
    box.replaceChildren();
    const shown = picks.filter((b) => filter === "all" || b.market === filter)
      .sort((a, b) => a.commence.localeCompare(b.commence) || b.ev - a.ev);
    if (!shown.length) {
      box.append(el("div", "empty", "No bets right now. Nothing beats the sharp market by " +
        "enough, which is the usual answer and the right one."));
      return;
    }
    let day = null, grid = null;
    shown.forEach((b) => {
      const d = dayOf(b.commence);
      if (d !== day) {
        day = d;
        box.append(el("div", "day", d));
        grid = el("div", "cards");
        box.append(grid);
      }
      const c = el("article", "card");
      const top = el("div", "top");
      const t = el("div");
      t.append(el("div", "bet", `${label(b)} (${odds(b.price)})`),
               el("div", "game", `${short(b.away)} @ ${short(b.home)} · ${kick(b.commence)}`));
      top.append(t, el("span", "pill", b.book));
      const nums = el("div", "nums");
      [[money(b.stake), "stake"], [pct(b.win_chance), "win chance"], [pct(b.ev), "edge"]]
        .forEach(([v, n]) => {
          const s = el("span");
          s.append(el("b", "", v), document.createTextNode(n));
          nums.append(s);
        });
      const m = el("div", "meter");
      const fill = el("i");
      fill.style.width = pct(b.win_chance);
      m.append(fill);
      c.append(top, nums, m, el("p", "why", b.why));
      grid.append(c);
    });
  }
  drawBets();

  // ---- track record
  const H = D.history.bets.filter((b) => !b.pulled);
  const pulled = D.history.bets.filter((b) => b.pulled);
  const S = D.history.summary;
  const rec = $("record-kpis");
  const graded = H.filter((b) => b.result).sort((a, b) => a.commence.localeCompare(b.commence));
  kpi(rec, `${S.wins}-${S.losses}${S.pushes ? "-" + S.pushes : ""}`, "record (W-L-P)");
  kpi(rec, graded.length ? signed(S.profit) : "—", "profit",
      graded.length ? (S.profit >= 0 ? "win" : "loss") : "");
  kpi(rec, S.roi == null ? "—" : (S.roi > 0 ? "+" : "") + pct(S.roi), "return on stakes");
  kpi(rec, String(H.filter((b) => !b.result).length), "bets waiting on a result");

  const chart = $("chart");
  function drawChart() {
    chart.querySelectorAll("svg,.empty").forEach((n) => n.remove());
    if (graded.length < 2) {
      chart.append(el("div", "empty", graded.length
        ? "The profit chart starts after the second graded bet."
        : "Bets are graded automatically once final scores are posted."));
      return;
    }
    let run = 0;
    const pts = [{i: 0, y: 0}].concat(graded.map((b, i) => ({i: i + 1, y: (run += b.profit), b})));
    const W = Math.max(300, chart.clientWidth - 24), Hh = 200, P = {l: 52, r: 10, t: 10, b: 22};
    const ys = pts.map((p) => p.y), lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
    const pad = (hi - lo) * 0.1 || 10;
    const x = (i) => P.l + (i / (pts.length - 1)) * (W - P.l - P.r);
    const y = (v) => P.t + (1 - (v - (lo - pad)) / (hi - lo + 2 * pad)) * (Hh - P.t - P.b);
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${Hh}`);
    svg.setAttribute("width", "100%");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Cumulative profit by bet");
    const add = (tag, attrs) => {
      const n = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
      svg.append(n);
      return n;
    };
    const cs = getComputedStyle(document.documentElement);
    const col = (v) => cs.getPropertyValue(v).trim();
    [lo - pad, 0, hi + pad].forEach((v) => {
      add("line", {x1: P.l, x2: W - P.r, y1: y(v), y2: y(v), stroke: col("--line")});
      add("text", {x: P.l - 6, y: y(v) + 4, "text-anchor": "end", "font-size": 11,
                   fill: col("--mute")}).textContent = money(Math.round(v));
    });
    add("text", {x: W - P.r, y: Hh - 4, "text-anchor": "end", "font-size": 11,
                 fill: col("--mute")}).textContent = `${graded.length} graded bets`;
    const last = pts[pts.length - 1].y;
    add("path", {d: pts.map((p, k) => `${k ? "L" : "M"}${x(p.i)},${y(p.y)}`).join(""),
                 fill: "none", stroke: col(last >= 0 ? "--ok" : "--bad"), "stroke-width": 2.5,
                 "stroke-linejoin": "round"});
    const dot = add("circle", {r: 4, fill: col("--acc"), visibility: "hidden"});
    const tip = $("tip");
    svg.addEventListener("pointermove", (e) => {
      const r = svg.getBoundingClientRect();
      const i = Math.round(((e.clientX - r.left) * (W / r.width) - P.l) / (W - P.l - P.r) * (pts.length - 1));
      const p = pts[Math.max(1, Math.min(pts.length - 1, i))];
      dot.setAttribute("cx", x(p.i)); dot.setAttribute("cy", y(p.y));
      dot.setAttribute("visibility", "visible");
      tip.textContent = `${label(p.b)} · ${p.b.result} ${signed(p.b.profit)} · total ${signed(p.y)}`;
      tip.style.display = "block";
      const left = (x(p.i) / W) * r.width + 12;
      tip.style.left = Math.min(left, chart.clientWidth - tip.offsetWidth - 8) + "px";
      tip.style.top = (y(p.y) / Hh) * r.height - 10 + "px";
    });
    svg.addEventListener("pointerleave", () => {
      tip.style.display = "none";
      dot.setAttribute("visibility", "hidden");
    });
    chart.append(svg);
  }
  drawChart();
  let wait;
  window.addEventListener("resize", () => { clearTimeout(wait); wait = setTimeout(drawChart, 150); });

  const table = (id, heads, rows) => {
    const t = $(id);
    const hr = el("tr");
    heads.forEach(([h, r]) => hr.append(el("th", r ? "r" : "", h)));
    t.append(hr);
    rows.forEach((cells) => {
      const tr = el("tr");
      cells.forEach(([v, cls]) => tr.append(el("td", cls || "", v)));
      t.append(tr);
    });
  };
  const past = H.concat(pulled).sort((a, b) => b.commence.localeCompare(a.commence));
  if (past.length) {
    table("history", [["Date"], ["Game"], ["Bet"], ["Book"], ["Stake", 1], ["Win %", 1],
                      ["Final"], ["Result"], ["Profit", 1]],
      past.map((b) => [
        [new Date(b.commence).toLocaleDateString("en-US", {...ET, month: "short", day: "numeric"})],
        [`${short(b.away)} @ ${short(b.home)}`],
        [`${label(b)} (${odds(b.price)})`], [b.book],
        [money(b.stake), "r"], [pct(b.win_chance, 0), "r"],
        [b.final || ""],
        b.pulled ? ["pulled (line moved)", "open"] : [b.result || "open", b.result || "open"],
        [b.profit == null ? "" : signed(b.profit), "r " + (b.result || "")],
      ]));
  } else {
    $("history").closest(".tablewrap").hidden = true;
  }

  // ---- no-money spread test
  const P = D.paper;
  if (!P || !P.bets.length) {
    if (P) {
      $("paper-sub").textContent = "The model's spread picks at early lines (ratings plus injuries) are logged here " +
        `once next week's lines are posted (a ${P.gap}-point disagreement or more). ` +
        "None yet.";
      $("paper-kpis").hidden = true;
      $("paper").closest(".tablewrap").hidden = true;
    } else {
      $("paper-wrap").hidden = true;
    }
  } else {
    const Q = P.summary;
    $("paper-sub").textContent = "Spreads where the team ratings plus injuries disagree with the early line " +
      `by ${P.gap}+ points. Not staked: it earns a place in the real picks only if it beats ` +
      "the closing line over a season.";
    const pk = $("paper-kpis");
    kpi(pk, String(Q.bets), "test bets logged");
    kpi(pk, Q.wins + Q.losses ? `${Q.wins}-${Q.losses}${Q.pushes ? "-" + Q.pushes : ""}` : "—",
        "record vs early line");
    kpi(pk, Q.avg_clv == null ? "—" : (Q.avg_clv > 0 ? "+" : "") + Q.avg_clv.toFixed(2) + " pts",
        "average line move our way", Q.avg_clv == null ? "" : (Q.avg_clv > 0 ? "win" : "loss"));
    kpi(pk, Q.beat_close == null ? "—" : pct(Q.beat_close, 0), "beat the closing line");
    const sp = (x) => (x > 0 ? "+" : "") + x;
    table("paper", [["Date"], ["Game"], ["Test bet"], ["Model says"], ["Gap", 1],
                    ["Close", 1], ["Moved", 1], ["Final"], ["Result"]],
      P.bets.slice().sort((a, b) => b.commence.localeCompare(a.commence)).map((b) => {
        const mm = b.model_margin;
        const fav = mm >= 0 ? short(b.home) : short(b.away);
        const sign = b.side === b.home ? 1 : -1;
        return [
          [new Date(b.commence).toLocaleDateString("en-US", {...ET, month: "short", day: "numeric"})],
          [`${short(b.away)} @ ${short(b.home)}`],
          [`${short(b.side)} ${sp(b.point)}`],
          [`${fav} by ${Math.abs(mm).toFixed(1)}`],
          [Math.abs(b.gap).toFixed(1), "r"],
          [b.close == null ? "" : sp(-sign * b.close), "r"],
          [b.clv == null ? "" : sp(b.clv), "r " + (b.clv > 0 ? "win" : b.clv < 0 ? "loss" : "")],
          [b.final || ""], [b.result || "open", b.result || "open"],
        ];
      }));
  }

  if (D.fair.length) {
    table("fair", [["Game"], ["Home by (market)", 1], ["Home by (model)", 1], ["Market total", 1],
                   ["Model total", 1]],
      D.fair.map((f) => [[`${short(f.away)} @ ${short(f.home)}`],
        [(f.market_margin > 0 ? "+" : "") + f.market_margin.toFixed(1), "r"],
        [(f.margin > 0 ? "+" : "") + f.margin.toFixed(1), "r"],
        [f.market_total.toFixed(1), "r"], [f.total.toFixed(1), "r"]]));
  } else {
    $("fair").closest("details").hidden = true;
  }
})();
</script>
</body>
</html>
